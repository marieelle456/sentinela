<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico - Hospital Sentinela</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

<hr>

<!-- ÁREA QUE SERÁ IMPRESSA -->
<div id="areaConsulta">

  <h3>Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >

  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>

</div>

<!-- BOTÕES NÃO SERÃO IMPRESSOS -->
<div class="botoesConsulta">

  <button onclick="salvar()">
    💾 Salvar Consulta
  </button>

  <button
    onclick="baixarPDF()"
    class="btn-pdf"
  >
    🖨️ Baixar PDF
  </button>

</div>


  <button
    onclick="window.print()"
    class="btn-pdf"
  >
    🖨️ Baixar PDF
  </button>

</div>

<script>

function baixarPDF() {

  const paciente =
    document.getElementById("paciente").value;

  if (!paciente) {
    alert("Selecione um paciente primeiro.");
    return;
  }

  window.print();
}


  
let triagensCarregadas = [];

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";

      if (data.length === 0) {

        div.innerHTML =
          "<p>Nenhuma triagem aguardando atendimento.</p>";

        return;
      }

      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>
              👤 ${t.nome}
            </h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <b>Classificação:</b>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <button onclick="selecionar(${index})">
              🩺 Atender Paciente
            </button>

          </div>

        `;

      });

    });

}

function selecionar(index) {

  const t =
    triagensCarregadas[index];

  document.getElementById("paciente").value =
    t.nome;

  document.getElementById("obs").value =
    t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ ATENÇÃO!\n\nPaciente possui alergia: " +
      t.alergia
    );

  }

}

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">
          Selecione a medicação
        </option>
      `;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    });

}

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;

  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;

  }

  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;

  }

  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert("Consulta salva com sucesso!");

    document.getElementById("diagnostico").value = "";

    document.getElementById("medicacao").value = "";

    document.getElementById("obs").value = "";

  });

}

carregar();

carregarMedicacoes();

</script>

</body>
</html>
