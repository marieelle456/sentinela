<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Sentinela - Atendimento</title>


    <style>

        /* =====================================================
           CONFIGURAÇÃO GERAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            padding: 40px 20px;

            color: #16324f;

            background:

                radial-gradient(
                    circle at 10% 10%,
                    #93c5fd 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    #60a5fa 0%,
                    transparent 28%
                ),

                radial-gradient(
                    circle at 80% 90%,
                    #bfdbfe 0%,
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #dbeafe,
                    #eff6ff,
                    #bfdbfe
                );

        }


        /* =====================================================
           CONTAINER PRINCIPAL
        ===================================================== */

        .container {

            width: 100%;

            max-width: 1050px;

            margin: auto;

            padding: 40px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 28px;

            border: 1px solid #bfdbfe;

            box-shadow:

                0 25px 60px rgba(15, 53, 88, 0.20),

                0 0 50px rgba(59, 130, 246, 0.18);

        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .cabecalho {

            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 25px;

        }


        .logo {

            width: 65px;

            height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background:

                linear-gradient(
                    135deg,
                    #06244b,
                    #0b4f91,
                    #3b82f6
                );

            color: white;

            font-size: 38px;

            font-weight: bold;

            box-shadow:

                0 10px 25px rgba(37, 99, 235, 0.35);

        }


        .cabecalho h1 {

            font-size: 32px;

            color: #062d57;

        }


        .cabecalho p {

            margin-top: 5px;

            color: #64809b;

            font-size: 15px;

        }


        /* =====================================================
           LINHA
        ===================================================== */

        hr {

            border: none;

            height: 2px;

            margin: 25px 0 35px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #93c5fd,
                    #2563eb,
                    #93c5fd,
                    transparent
                );

        }


        /* =====================================================
           TÍTULO ATENDIMENTO
        ===================================================== */

        .titulo {

            text-align: center;

            margin-bottom: 30px;

        }


        .titulo h2 {

            font-size: 32px;

            color: #082f5f;

            margin-bottom: 8px;

        }


        .titulo p {

            color: #66819d;

            font-size: 15px;

        }


        /* =====================================================
           SEÇÕES DO ATENDIMENTO
        ===================================================== */

        .secao {

            margin-bottom: 25px;

            padding: 28px;

            border-radius: 20px;

            background:

                linear-gradient(
                    135deg,
                    #f8fbff,
                    #eef6ff
                );

            border: 1px solid #bfdbfe;

            box-shadow:

                0 8px 25px rgba(15, 53, 88, 0.08);

        }


        .secao h3 {

            color: #0a3d73;

            font-size: 21px;

            margin-bottom: 22px;

            padding-left: 14px;

            border-left: 5px solid #2563eb;

        }


        /* =====================================================
           CAMPOS
        ===================================================== */

        .linha {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }


        .campo {

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 8px;

            color: #244d73;

            font-size: 14px;

            font-weight: bold;

        }


        .campo input,
        .campo select {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 2px solid #c5dcf5;

            border-radius: 12px;

            background: white;

            color: #173b5e;

            font-size: 15px;

            outline: none;

            transition: 0.25s;

        }


        .campo input::placeholder {

            color: #8ba2b8;

        }


        .campo input:focus,
        .campo select:focus {

            border-color: #2563eb;

            box-shadow:

                0 0 0 4px rgba(37, 99, 235, 0.12);

        }


        /* =====================================================
           FOTO
        ===================================================== */

        .foto-box {

            padding: 25px;

            border: 2px dashed #8bbcf0;

            border-radius: 18px;

            background: #f8fbff;

            text-align: center;

        }


        .camera {

            font-size: 40px;

            margin-bottom: 10px;

        }


        .foto-box h4 {

            color: #0b427b;

            font-size: 18px;

            margin-bottom: 7px;

        }


        .foto-box p {

            color: #7189a0;

            font-size: 14px;

            margin-bottom: 18px;

        }


        .foto-box input[type="file"] {

            width: auto;

            border: none;

            background: transparent;

            height: auto;

        }


        /* =====================================================
           BOTÃO PRINCIPAL
        ===================================================== */

        .btn-cadastrar {

            width: 100%;

            height: 62px;

            border: none;

            border-radius: 15px;

            background:

                linear-gradient(
                    135deg,
                    #062653,
                    #0b4f91,
                    #1976d2,
                    #3b82f6
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                0 7px 0 #041d3d,

                0 15px 30px rgba(15, 82, 150, 0.30);

            transition: 0.2s;

        }


        .btn-cadastrar:hover {

            transform: translateY(-3px);

            box-shadow:

                0 10px 0 #041d3d,

                0 20px 35px rgba(15, 82, 150, 0.35);

        }


        .btn-cadastrar:active {

            transform: translateY(4px);

            box-shadow:

                0 3px 0 #041d3d;

        }


        /* =====================================================
           BOTÕES GERAIS
        ===================================================== */

        button {

            font-family: Arial, Helvetica, sans-serif;

        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 700px) {

            body {

                padding: 15px;

            }


            .container {

                padding: 22px;

                border-radius: 20px;

            }


            .cabecalho {

                flex-direction: column;

                text-align: center;

            }


            .cabecalho h1 {

                font-size: 26px;

            }


            .linha {

                grid-template-columns: 1fr;

                gap: 0;

            }


            .secao {

                padding: 20px;

            }

        }


        /* =====================================================
           IMPRESSÃO
        ===================================================== */

        @media print {

            body {

                background: white;

                padding: 0;

            }


            .container {

                width: 100%;

                max-width: none;

                box-shadow: none;

                border: none;

            }


            .btn-cadastrar {

                display: none;

            }

        }

└────────────────────────┘

        
    </style>

</head>


<body>


    <div class="container">


        <!-- ================================================
             CABEÇALHO
        ================================================= -->

        <div class="cabecalho">

            <div class="logo">
                +
            </div>

            <div>

                <h1>
                    Hospital Sentinela
                </h1>

                <p>
                    Cadastro de Atendimento
                </p>

            </div>

        </div>


        <hr>


        <!-- ================================================
             TÍTULO
        ================================================= -->

        <div class="titulo">

            <h2>
                Atendimento
            </h2>

            <p>
                Preencha os dados do paciente para iniciar o atendimento.
            </p>

        </div>


        <!-- ================================================
             DADOS DO PACIENTE
        ================================================= -->

        <div class="secao">

            <h3>
                Dados do paciente
            </h3>


            <div class="linha">


                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome completo"
                    >

                </div>


                <div class="campo">

                    <label for="cpf">
                        CPF/RG
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="Digite o CPF ou RG"
                    >

                </div>


            </div>


            <div class="linha">


                <div class="campo">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                    >

                </div>


                <div class="campo">

                    <label for="sexo">
                        Sexo
                    </label>

                    <select id="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option>
                            Feminino
                        </option>

                        <option>
                            Masculino
                        </option>

                        <option>
                            Outro
                        </option>

                    </select>

                </div>


            </div>


            <div class="campo">

                <label for="nomeMae">
                    Nome da mãe
                </label>

                <input
                    type="text"
                    id="nomeMae"
                    placeholder="Digite o nome da mãe"
                >

            </div>


            <div class="linha">


                <div class="campo">

                    <label for="estadoCivil">
                        Estado civil
                    </label>

                    <select id="estadoCivil">

                        <option>
                            Selecione
                        </option>

                        <option>
                            Solteiro(a)
                        </option>

                        <option>
                            Casado(a)
                        </option>

                        <option>
                            Divorciado(a)
                        </option>

                        <option>
                            Viúvo(a)
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                    >

                </div>


            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite o e-mail"
                >

            </div>


            <div class="campo">

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número, bairro e cidade"
                >

            </div>


            <div class="campo">

                <label for="contato">
                    Contato de emergência
                </label>

                <input
                    type="text"
                    id="contato"
                    placeholder="Nome e telefone do contato"
                >

            </div>

        </div>


        <!-- ================================================
             TIPO DE ATENDIMENTO
        ================================================= -->

        <div class="secao">

            <h3>
                Tipo de atendimento
            </h3>


            <div class="campo">

                <label for="tipo">
                    Forma de atendimento
                </label>

                <select id="tipo">

                    <option value="">
                        Selecione uma opção
                    </option>

                    <option value="Convenio">
                        Convênio
                    </option>

                    <option value="Particular">
                        Particular
                    </option>

                </select>

            </div>

        </div>


        <!-- ================================================
             FOTO DO PACIENTE
        ================================================= -->

        <div class="secao">

            <h3>
                Foto do paciente
            </h3>


            <div class="foto-box">

                <div class="camera">
                    📷
                </div>

                <h4>
                    Adicionar foto
                </h4>

                <p>
                    Selecione uma foto para identificação do paciente.
                </p>

                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                >

            </div>

        </div>


        <!-- ================================================
             BOTÃO
        ================================================= -->

        <button
            class="btn-cadastrar"
            onclick="cadastrar()"
        >

            Cadastrar paciente

        </button>


    </div>



    <!-- ================================================
         JAVASCRIPT
    ================================================= -->

    <script>

        function cadastrar() {

            const nome =
                document.getElementById("nome").value;

            const cpf =
                document.getElementById("cpf").value;

            const tipo =
                document.getElementById("tipo").value;


            if (!nome) {

                alert("Digite o nome do paciente.");

                return;

            }


            if (!cpf) {

                alert("Digite o CPF/RG.");

                return;

            }


            if (!tipo) {

                alert("Selecione a forma de atendimento.");

                return;

            }


            fetch("http://localhost:3000/atendimento", {

                method: "POST",

                headers: {

                    "Content-Type":
                    "application/json"

                },

                body: JSON.stringify({

                    nome: nome,

                    cpf: cpf,

                    tipo: tipo

                })

            })

            .then(response => response.json())

            .then(data => {

                alert(
                    data.mensagem ||
                    "Paciente enviado para triagem!"
                );

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Paciente cadastrado, mas não foi possível conectar ao servidor."
                );

            });

        }

    </script>


</body>

</html>
