<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Sentinela - Atendimento</title>

    <!-- CONEXÃO COM O CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container atendimento">

        <!-- CABEÇALHO -->
        <header class="cabecalho-atendimento">

            <div class="icone-hospital">
                +
            </div>

            <div>
                <h1>Hospital Sentinela</h1>
                <p>Cadastro de Atendimento</p>
            </div>

        </header>


        <hr>


        <!-- TÍTULO -->
        <section class="titulo-atendimento">

            <h2>Atendimento</h2>

            <p>
                Preencha os dados do paciente para iniciar o atendimento.
            </p>

        </section>


        <!-- =========================================
             DADOS DO PACIENTE
        ========================================== -->

        <section class="secao-formulario">

            <h3>Dados do paciente</h3>


            <div class="linha-campos">

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome completo"
                    >

                </div>


                <div class="campo">

                    <label for="cpf">
                        CPF/RG
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="Digite o CPF ou RG"
                    >

                </div>

            </div>


            <div class="linha-campos">

                <div class="campo">

                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                    >

                </div>


                <div class="campo">

                    <label for="sexo">
                        Sexo
                    </label>

                    <select id="sexo">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Outro">
                            Outro
                        </option>

                        <option value="Nao informado">
                            Prefiro não informar
                        </option>

                    </select>

                </div>

            </div>


            <div class="campo">

                <label for="nomeMae">
                    Nome da mãe
                </label>

                <input
                    type="text"
                    id="nomeMae"
                    placeholder="Digite o nome da mãe"
                >

            </div>


            <div class="linha-campos">

                <div class="campo">

                    <label for="estadoCivil">
                        Estado civil
                    </label>

                    <select id="estadoCivil">

                        <option value="">
                            Selecione
                        </option>

                        <option value="Solteiro">
                            Solteiro(a)
                        </option>

                        <option value="Casado">
                            Casado(a)
                        </option>

                        <option value="Divorciado">
                            Divorciado(a)
                        </option>

                        <option value="Viuvo">
                            Viúvo(a)
                        </option>

                        <option value="Uniao estavel">
                            União estável
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                    >

                </div>

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite o e-mail"
                >

            </div>


            <div class="campo">

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    placeholder="Rua, número, bairro e cidade"
                >

            </div>


            <div class="campo">

                <label for="contatoEmergencia">
                    Contato de emergência
                </label>

                <input
                    type="text"
                    id="contatoEmergencia"
                    placeholder="Nome e telefone do contato"
                >

            </div>

        </section>


        <!-- =========================================
             TIPO DE ATENDIMENTO
        ========================================== -->

        <section class="secao-formulario">

            <h3>Tipo de atendimento</h3>


            <div class="campo">

                <label for="tipo">
                    Forma de atendimento
                </label>

                <select id="tipo">

                    <option value="">
                        Selecione uma opção
                    </option>

                    <option value="Convenio">
                        Convênio
                    </option>

                    <option value="Particular">
                        Particular
                    </option>

                </select>

            </div>

        </section>


        <!-- =========================================
             FOTO DO PACIENTE
        ========================================== -->

        <section class="secao-formulario">

            <h3>Foto do paciente</h3>


            <div class="upload-foto">

                <div class="icone-camera">
                    📷
                </div>


                <div class="texto-foto">

                    <strong>
                        Adicionar foto
                    </strong>

                    <p>
                        Selecione uma foto para identificação do paciente.
                    </p>

                </div>


                <input
                    type="file"
                    id="foto"
                    accept="image/*"
                >

            </div>

        </section>


        <!-- =========================================
             BOTÃO
        ========================================== -->

        <button
            type="button"
            class="btn-cadastrar"
            onclick="cadastrar()"
        >
            Cadastrar paciente
        </button>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        function cadastrar() {

            const nome =
                document.getElementById("nome").value.trim();

            const cpf =
                document.getElementById("cpf").value.trim();

            const tipo =
                document.getElementById("tipo").value;


            if (!nome) {

                alert("Digite o nome do paciente.");

                return;
            }


            if (!cpf) {

                alert("Digite o CPF/RG do paciente.");

                return;
            }


            if (!tipo) {

                alert("Selecione o tipo de atendimento.");

                return;
            }


            fetch("http://localhost:3000/atendimento", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    nome: nome,

                    cpf: cpf,

                    tipo: tipo

                })

            })

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Erro ao cadastrar paciente"
                    );

                }

                return response.json();

            })

            .then(data => {

                alert(
                    data.mensagem ||
                    "Paciente enviado para triagem!"
                );

            })

            .catch(error => {

                console.error(error);

                alert(
                    "Não foi possível enviar o paciente para a triagem."
                );

            });

        }

    </script>

</body>

</html>
