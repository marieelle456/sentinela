
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hospital Sentinela</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #123b70, transparent 45%),
        radial-gradient(circle at bottom, #061a35, transparent 55%),
        #020b1c;

      color: white;
      padding: 20px;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 45px 35px;
      text-align: center;

      background: rgba(5, 24, 50, 0.95);
      border: 1px solid #2196f3;
      border-radius: 25px;

      box-shadow:
        0 0 20px rgba(33, 150, 243, 0.35),
        0 0 50px rgba(33, 150, 243, 0.15);
    }

    h2 {
      margin: 0 0 10px;
      color: #7dd3fc;
      font-size: 30px;
      letter-spacing: 1px;

      text-shadow:
        0 0 5px #7dd3fc,
        0 0 10px #38bdf8,
        0 0 20px #0ea5e9;
    }

    .subtitulo {
      margin-bottom: 30px;
      color: #60a5fa;
      text-shadow: 0 0 6px #3b82f6;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid #2563eb;
      background: #061a35;
      color: #e0f2fe;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input::placeholder {
      color: #6b9bd1;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow:
        0 0 8px #0ea5e9,
        0 0 20px rgba(14, 165, 233, 0.4);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 14px;

      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;

      text-shadow:
        0 0 5px white,
        0 0 10px white;

      box-shadow:
        0 0 8px #38bdf8,
        0 0 18px #0ea5e9,
        0 8px 0 #0284c7,
        0 15px 30px rgba(14, 165, 233, 0.5);

      transition: all 0.25s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-4px);
      background: linear-gradient(135deg, #bae6fd, #7dd3fc);

      box-shadow:
        0 0 10px #e0f2fe,
        0 0 25px #38bdf8,
        0 0 45px #0ea5e9,
        0 8px 0 #0284c7,
        0 20px 35px rgba(14, 165, 233, 0.6);
    }

    button:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow:
        0 0 5px #38bdf8,
        0 0 15px #0ea5e9,
        0 4px 0 #0284c7;
    }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    #mensagem {
      margin-top: 18px;
      min-height: 22px;
      overflow-wrap: anywhere;
      color: #7dd3fc;
      font-weight: bold;
      text-shadow:
        0 0 5px #38bdf8,
        0 0 10px #0ea5e9;
    }

    #mensagem.erro {
      color: #f87171;
      text-shadow:
        0 0 5px #ef4444,
        0 0 10px #dc2626;
    }

    #mensagem.sucesso {
      color: #4ade80;
      text-shadow:
        0 0 5px #22c55e,
        0 0 10px #16a34a;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;

      filter:
        drop-shadow(0 0 5px #7dd3fc)
        drop-shadow(0 0 15px #38bdf8)
        drop-shadow(0 0 25px #0ea5e9);

      transition: 0.3s ease;
    }

    .logo img:hover {
      transform: scale(1.08);
      filter:
        drop-shadow(0 0 8px #e0f2fe)
        drop-shadow(0 0 20px #38bdf8)
        drop-shadow(0 0 35px #0ea5e9);
    }

    @media (max-width: 600px) {
      .container {
        padding: 35px 25px;
      }

      h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      <img src="logoo.png" alt="Logo Hospital Sentinela">
    </div>

    <h2>Hospital Sentinela</h2>

    <p class="subtitulo">Sistema de Atendimento</p>

    <form id="formLogin">
      <input
        id="usuario"
        name="usuario"
        type="text"
        placeholder="Usuário"
        autocomplete="username"
        aria-label="Usuário"
        required
      >

      <input
        id="senha"
        name="senha"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
        aria-label="Senha"
        required
      >

      <button id="btnEntrar" type="submit">
        ENTRAR
      </button>
    </form>

    <div id="mensagem" role="status" aria-live="polite"></div>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("formLogin");
      const usuarioInput = document.getElementById("usuario");
      const senhaInput = document.getElementById("senha");
      const btnEntrar = document.getElementById("btnEntrar");
      const mensagem = document.getElementById("mensagem");

      let enviando = false;

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (enviando) return;

        const usuario = usuarioInput.value.trim();
        const senha = senhaInput.value;

        mensagem.textContent = "";
        mensagem.className = "";

        if (!usuario || !senha.trim()) {
          mensagem.textContent = "Preencha o usuário e a senha.";
          mensagem.className = "erro";
          return;
        }

        enviando = true;
        btnEntrar.disabled = true;
        btnEntrar.textContent = "ENTRANDO...";

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              usuario: usuario,
              senha: senha
            })
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.erro ||
              data.mensagem ||
              "Usuário ou senha inválidos."
            );
          }

          const paginas = {
            triagem: "triagem.html",
            medico: "medico.html",
            atendimento: "atendimento.html"
          };

          if (!data.tipo || !paginas[data.tipo]) {
            throw new Error(
              "O servidor não retornou um tipo de usuário válido."
            );
          }

          mensagem.textContent = "Login realizado com sucesso!";
          mensagem.className = "sucesso";

          window.location.href = paginas[data.tipo];

        } catch (error) {
          console.error("Erro no login:", error);

          mensagem.textContent =
            error.message ||
            "Não foi possível conectar ao servidor. Tente novamente.";

          mensagem.className = "erro";

        } finally {
          enviando = false;
          btnEntrar.disabled = false;
          btnEntrar.textContent = "ENTRAR";
        }
      });
    });
  </script>

</body>
</html>
